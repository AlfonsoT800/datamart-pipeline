services:
  hadoop:
    build: ./hadoop
    container_name: hadoop
    volumes:
      - ./data:/data/input:ro
      - ./output:/data/output
      - ./mapreduce:/home/hadoop/mapreduce
      - ./ssh/api_key.pub:/home/hadoop/.ssh/authorized_keys2:ro
    networks: [datamart]

  db:
    ports:
      - "127.0.0.1:5432:5432"
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [datamart]

  api:
    build: ./api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./ssh/api_key:/root/.ssh/id_ed25519:ro
    networks: [datamart]

volumes:
  pgdata:

networks:
  datamart:
